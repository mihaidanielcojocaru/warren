<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <title>Warren menu bar icon — disconnected</title>
  <!--
    Same arch, knocked out around a slash so the two shapes stay legible at 16pt.
    Template image: pure black plus alpha only.
  -->
  <defs>
    <mask id="gap">
      <rect width="18" height="18" fill="#FFFFFF"/>
      <line x1="3.2" y1="3.2" x2="14.8" y2="14.8"
            stroke="#000000" stroke-width="4.4" stroke-linecap="round"/>
    </mask>
  </defs>

  <path fill="#000000" fill-rule="evenodd" mask="url(#gap)"
        d="M2.6 15.4 V9.4 a6.4 6.4 0 0 1 12.8 0 V15.4 Z
           M4.4 15.4 V9.4 a4.6 4.6 0 0 1 9.2 0 V15.4 Z"/>

  <line x1="3.9" y1="3.9" x2="14.1" y2="14.1"
        stroke="#000000" stroke-width="1.9" stroke-linecap="round"/>
</svg>
